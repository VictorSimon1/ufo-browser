<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>UFO-Browser Agent</title>
  </head>
  <body class="chat-page">
    <main id="chat-app" class="chat-shell">
      <header class="chat-header app-drag">
        <div class="traffic-space"></div>
        <div class="brand-mark">U</div>
        <div class="brand-copy">
          <strong>UFO-Browser Agent</strong>
          <span>Claude · Local Browser Workspace</span>
        </div>
        <button class="icon-button no-drag" id="history-button">↶</button>
        <button class="icon-button accent no-drag" id="new-chat-button">＋</button>
      </header>
      <section class="agent-card">
        <span class="presence-dot"></span>
        <div><strong>Browser Agent</strong><small>浏览器能力已就绪</small></div>
        <span class="chevron">›</span>
      </section>
      <section id="conversation" class="conversation">
        <article class="message assistant">
          <div class="message-label">UFO-Browser</div>
          <p>我可以在独立 Space 中浏览网页、填写表单和提取信息，同时不打断你当前的页面。</p>
          <div class="tool-row"><span>✓</span><div><strong>Browser runtime</strong><small>Unix socket · CDP · isolated Space</small></div><em>就绪</em></div>
        </article>
      </section>
      <footer class="composer-wrap">
        <div class="composer-tools">
          <button>▣ Assistant Workspace</button><button>↗ 当前页</button><button>Browser Agent⌄</button>
        </div>
        <div class="composer">
          <textarea id="prompt" placeholder="让 Agent 浏览网页、处理表单、提取信息…"></textarea>
          <span>Enter 发送 · Shift+Enter 换行</span>
          <button id="send" class="send">↑</button>
        </div>
      </footer>
    </main>
    <script src="./chat.js"></script>
  </body>
</html>
