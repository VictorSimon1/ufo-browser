<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>UFO-Browser</title>
  </head>
  <body class="browser-page">
    <main id="browser-shell" class="browser-shell">
      <div class="tabs-row app-drag">
        <div class="space-chip" title="当前 Space">
          <span class="space-mark">U</span>
          <strong id="space-name">UFO-Browser</strong>
        </div>
        <div id="tabs" class="tabs no-drag"></div>
        <button id="new-tab" class="new-tab" title="新建标签页" aria-label="新建标签页">＋</button>
        <button id="spaces-button" class="spaces-button" title="返回 Spaces" aria-label="返回 Spaces">
          <svg viewBox="0 0 16 16" aria-hidden="true">
            <rect x="2" y="2" width="4" height="4" rx="1"></rect>
            <rect x="10" y="2" width="4" height="4" rx="1"></rect>
            <rect x="2" y="10" width="4" height="4" rx="1"></rect>
            <rect x="10" y="10" width="4" height="4" rx="1"></rect>
          </svg>
          <span id="spaces-count">0</span>
        </button>
      </div>
      <div class="toolbar no-drag">
        <button id="back" title="后退" aria-label="后退">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M11.8 4.8 6.6 10l5.2 5.2"></path></svg>
        </button>
        <button id="forward" title="前进" aria-label="前进">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8.2 4.8 5.2 5.2-5.2 5.2"></path></svg>
        </button>
        <button id="reload" title="刷新" aria-label="刷新">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M15.7 6.8A6.3 6.3 0 1 0 16 12"></path><path d="M15.7 3.8v3.5h-3.5"></path></svg>
        </button>
        <form id="address-form">
          <div class="address-shell">
            <span id="site-identity" class="site-identity" aria-hidden="true">
              <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.2"></circle><path d="M3.9 10h12.2M10 3.8c2.1 2.2 2.1 10.2 0 12.4M10 3.8c-2.1 2.2-2.1 10.2 0 12.4"></path></svg>
            </span>
            <input id="address" aria-label="地址和搜索" placeholder="搜索或输入网址" autocomplete="off" spellcheck="false" />
          </div>
        </form>
      </div>
      <div id="page-progress" class="page-progress" aria-hidden="true"></div>
      <div id="chrome-lock" class="chrome-lock hidden">
        <span><i></i><strong id="browser-status">Agent 正在控制此 Space</strong></span>
      </div>
    </main>
    <script src="./browser.js"></script>
  </body>
</html>
