<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles.css" />
    <title>UFO-Browser · Spaces</title>
  </head>
  <body class="overview-page">
    <main class="overview-shell">
      <header class="overview-header app-drag">
        <div class="overview-brand">
          <img src="./app-icon.png" alt="" aria-hidden="true" />
          <span class="overview-brand-copy">
            <strong>UFO-Browser</strong>
            <small id="app-version">v0.0.0</small>
          </span>
        </div>
        <div class="overview-title"><strong>Spaces</strong><span id="space-count">0 spaces</span></div>
        <div class="overview-actions no-drag">
          <button id="profile-button" class="profile-button" title="浏览器 Profile" aria-label="选择浏览器 Profile" aria-haspopup="dialog">
            <span id="profile-avatar" class="profile-avatar">U</span>
            <span id="profile-button-label">UFO-Browser</span>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m7 8 3 3 3-3"></path></svg>
          </button>
          <button id="quick-create" class="grid-button" title="新建 Space" aria-label="新建 Space">
            <svg viewBox="0 0 20 20" aria-hidden="true">
              <rect x="3" y="3" width="5" height="5" rx="1.3"></rect>
              <rect x="12" y="3" width="5" height="5" rx="1.3"></rect>
              <rect x="3" y="12" width="5" height="5" rx="1.3"></rect>
              <path d="M14.5 11.8v5.4M11.8 14.5h5.4"></path>
            </svg>
          </button>
        </div>
        <div id="profile-sync-strip" class="profile-sync-strip no-drag" hidden aria-live="polite">
          <span id="profile-sync-label">正在检查登录状态</span>
          <b><i id="profile-sync-fill"></i></b>
        </div>
      </header>
      <section id="spaces-grid" class="spaces-grid"></section>
    </main>
    <div id="trace-dialog-backdrop" class="trace-dialog-backdrop" hidden>
      <section class="trace-dialog no-drag" role="dialog" aria-modal="true" aria-labelledby="trace-dialog-title">
        <header class="trace-dialog-header">
          <div>
            <strong id="trace-dialog-title">Agent 执行记录</strong>
            <span id="trace-dialog-subtitle">Space 的本地动作与诊断时间线</span>
          </div>
          <button id="trace-dialog-close" class="dialog-icon-button" title="关闭" aria-label="关闭">×</button>
        </header>
        <div id="trace-dialog-content" class="trace-dialog-content"></div>
      </section>
    </div>
    <div id="profile-dialog-backdrop" class="profile-dialog-backdrop" hidden>
      <section class="profile-dialog no-drag" role="dialog" aria-modal="true" aria-labelledby="profile-dialog-title">
        <header class="profile-dialog-header">
          <div>
            <strong id="profile-dialog-title">浏览器 Profile</strong>
            <span id="profile-dialog-subtitle">新 Space 将使用所选登录状态</span>
          </div>
          <button id="profile-dialog-close" class="dialog-icon-button" title="关闭" aria-label="关闭">×</button>
        </header>
        <div id="profile-dialog-content" class="profile-dialog-content"></div>
      </section>
    </div>
    <script src="./overview.js"></script>
  </body>
</html>
